<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alex Runtime — Software Engineering News</title>
  <meta name="description" content="Software engineering news that actually matters. Curated news, tools, and war stories for software engineers." />
  <meta property="og:title" content="Alex Runtime — Software Engineering News" />
  <meta property="og:description" content="Software engineering news that actually matters. Curated news, tools, and war stories for software engineers." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@AlexRuntime" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <style>
    :root {
      --bg: #010B19;
      --card: #0A1526;
      --cyan: #03B2EB;
      --orange: #F69012;
      --text: #FFFFFF;
      --muted: #A8B7C7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .glow {
      pointer-events: none;
      position: absolute;
      inset: 0;
      opacity: 0.6;
      background: radial-gradient(circle at 50% 30%, rgba(3, 178, 235, 0.15) 0%, transparent 45%);
    }
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 28rem;
      width: 100%;
    }
    img.logo {
      width: 9rem;
      height: 9rem;
      border-radius: 9999px;
      box-shadow: 0 0 40px rgba(3, 178, 235, 0.25);
    }
    h1 {
      margin-top: 2rem;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
    }
    @media (min-width: 640px) { h1 { font-size: 3rem; } }
    .tagline { margin-top: 1rem; font-size: 1.125rem; color: var(--muted); }
    .buttons {
      margin-top: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }
    @media (min-width: 640px) { .buttons { flex-direction: row; justify-content: center; } }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-radius: 0.75rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: var(--cyan);
      color: var(--bg);
      box-shadow: 0 10px 15px -3px rgba(3, 178, 235, 0.2);
    }
    .btn-primary:hover { background: rgba(3, 178, 235, 0.9); }
    .btn-secondary {
      border: 1px solid rgba(3, 178, 235, 0.3);
      background: var(--card);
      color: var(--text);
    }
    .btn-secondary:hover { border-color: var(--cyan); background: rgba(3, 178, 235, 0.1); }
    .btn svg { width: 1.25rem; height: 1.25rem; }
    .sub { margin-top: 2rem; max-width: 20rem; font-size: 0.875rem; color: rgba(168, 183, 199, 0.8); }
    footer {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.75rem;
      color: rgba(168, 183, 199, 0.6);
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <main class="content">
    <img class="logo" src="logo.png" alt="Alex Runtime logo" width="144" height="144" />
    <h1>Alex Runtime</h1>
    <p class="tagline">Software engineering news that actually matters.</p>
    <div class="buttons">
      <a class="btn btn-primary" href="https://www.youtube.com/@AlexRuntime" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
        </svg>
        Watch on YouTube
      </a>
      <a class="btn btn-secondary" href="https://alexruntime.kit.com/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
          <polyline points="22,6 12,13 2,6" />
        </svg>
        Get the newsletter
      </a>
    </div>
    <p class="sub">Curated news, tools, and war stories for engineers shipping real code.</p>
  </main>
  <footer>© <span id="year"></span> Alex Runtime</footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
